<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Projects · AI Agent Platform</title>
<script>
  (function () {
    var theme = localStorage.getItem("aiagent:theme") || "dark";
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="app-sidebar"></aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="sidebar-collapse-btn d-md-none" id="mobile-sidebar-toggle"><i class="bi bi-list"></i></button>
        <h5 class="mb-0">Projects</h5>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="theme-toggle" data-theme-toggle>
          <button type="button" data-theme-value="light" title="Light theme"><i class="bi bi-sun"></i></button>
          <button type="button" data-theme-value="dark" title="Dark theme"><i class="bi bi-moon-stars"></i></button>
        </div>
        <div class="user-menu-trigger" onclick="window.location.href='profile.html'">
          <div class="avatar-circle" id="topbar-user-avatar">--</div>
          <div class="d-none d-sm-block">
            <div style="font-size:0.85rem; font-weight:600;" id="topbar-user-name">Loading…</div>
            <div style="font-size:0.72rem; color:var(--text-muted);" id="topbar-user-email"></div>
          </div>
        </div>
        <button type="button" class="btn-ghost" id="topbar-logout-btn" title="Log out"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </header>

    <main class="app-content">
      <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
        <div class="filter-bar">
          <div class="theme-toggle labeled" id="status-filter-toggle">
            <button type="button" data-status-value="active" class="active">Active</button>
            <button type="button" data-status-value="archived">Archived</button>
          </div>
        </div>
        <button type="button" class="btn-brand" id="new-project-btn"><i class="bi bi-plus-lg"></i> New Project</button>
      </div>

      <div id="projects-skeleton" class="project-grid d-none">
        <div class="surface skeleton" style="height:150px;"></div>
        <div class="surface skeleton" style="height:150px;"></div>
        <div class="surface skeleton" style="height:150px;"></div>
      </div>

      <div id="projects-empty" class="empty-state d-none">
        <div class="empty-icon"><i class="bi bi-kanban"></i></div>
        <h5 id="projects-empty-title">No projects yet</h5>
        <p id="projects-empty-subtitle">Create your first project to start organizing your work.</p>
        <button type="button" class="btn-brand" id="empty-new-project-btn"><i class="bi bi-plus-lg"></i> New Project</button>
      </div>

      <div id="project-grid" class="project-grid"></div>
    </main>
  </div>
</div>

<!-- Create/Edit project modal -->
<div class="modal fade" id="project-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content surface">
      <div class="modal-body p-4">
        <h5 class="mb-3" id="project-modal-title">New Project</h5>
        <div id="project-modal-alert" class="alert-inline"></div>
        <form id="project-form" novalidate>
          <input type="hidden" id="project-id" />
          <div class="mb-3">
            <label class="field-label" for="project-name">Name</label>
            <input class="form-control-premium" type="text" id="project-name" name="name" required maxlength="255" />
            <div class="field-error" data-error-for="name"></div>
          </div>
          <div class="mb-3">
            <label class="field-label" for="project-description">Description <span style="font-weight:400; color:var(--text-muted);">(optional)</span></label>
            <textarea class="form-control-premium" id="project-description" name="description" rows="3"></textarea>
          </div>
          <div class="d-flex justify-content-end gap-2 mt-3">
            <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn-brand" id="project-form-submit"><i class="bi bi-check2"></i> Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/modals.js"></script>
<script src="../assets/js/projects.js"></script>
</body>
</html>
