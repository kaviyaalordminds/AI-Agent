<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Chat · AI Agent Platform</title>
<script>
  (function () {
    var theme = localStorage.getItem("aiagent:theme") || "dark";
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/agent.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="app-sidebar"></aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="sidebar-collapse-btn d-md-none" id="mobile-sidebar-toggle"><i class="bi bi-list"></i></button>
        <button type="button" class="sidebar-collapse-btn d-md-none" id="mobile-conv-toggle"><i class="bi bi-chat-left-text"></i></button>
        <h5 class="mb-0">AI Chat</h5>
        <span class="badge-pill badge-muted" id="claude-status-badge"><span class="dot dot-muted"></span> Checking…</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="theme-toggle" data-theme-toggle>
          <button type="button" data-theme-value="light" title="Light theme"><i class="bi bi-sun"></i></button>
          <button type="button" data-theme-value="dark" title="Dark theme"><i class="bi bi-moon-stars"></i></button>
        </div>
        <div class="user-menu-trigger" onclick="window.location.href='profile.html'">
          <div class="avatar-circle" id="topbar-user-avatar">--</div>
          <div class="d-none d-sm-block">
            <div style="font-size:0.85rem; font-weight:600;" id="topbar-user-name">Loading…</div>
            <div style="font-size:0.72rem; color:var(--text-muted);" id="topbar-user-email"></div>
          </div>
        </div>
        <button type="button" class="btn-ghost" id="topbar-logout-btn" title="Log out"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </header>

    <div class="agent-shell">
      <aside class="agent-conv-list" id="agent-conv-list">
        <div class="agent-conv-list-header">
          <button type="button" class="btn-brand w-100" id="new-chat-btn"><i class="bi bi-plus-lg"></i> New chat</button>
        </div>
        <div class="agent-conv-items" id="conv-items">
          <div class="skeleton mb-2" style="height:56px; border-radius:10px;"></div>
          <div class="skeleton" style="height:56px; border-radius:10px;"></div>
        </div>
      </aside>

      <main class="agent-main">
        <div id="provider-banner" class="agent-provider-banner d-none">
          <i class="bi bi-exclamation-triangle-fill"></i>
          <span id="provider-banner-text"></span>
        </div>

        <div id="thread-empty-state" class="empty-state" style="margin: auto;">
          <div class="empty-icon"><i class="bi bi-chat-dots"></i></div>
          <h5>Start a conversation</h5>
          <p style="font-size:0.85rem;">Pick a mode and send your first message.</p>
          <div class="mode-pill-group justify-content-center" id="empty-mode-picker"></div>
        </div>

        <div id="thread-active" class="d-none" style="display:flex; flex-direction:column; min-height:0; flex:1;">
          <div class="agent-thread" id="agent-thread"></div>
          <div class="agent-composer">
            <div class="surface agent-composer-shell">
              <textarea id="composer-input" rows="1" placeholder="Message the AI Agent…"></textarea>
              <button type="button" class="btn-brand" id="composer-send-btn"><i class="bi bi-arrow-up"></i></button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>

<!-- New chat modal -->
<div class="modal fade" id="new-chat-modal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content surface">
      <div class="modal-body p-4">
        <h5 class="mb-3">New chat</h5>
        <label class="field-label">Mode</label>
        <div class="mode-pill-group mb-3" id="new-chat-mode-picker"></div>
        <div class="mb-3" id="new-chat-project-wrap">
          <label class="field-label" for="new-chat-project">Project <span style="font-weight:400; color:var(--text-muted);">(optional)</span></label>
          <select class="form-control-premium" id="new-chat-project">
            <option value="">No project</option>
          </select>
        </div>
        <div class="d-flex justify-content-end gap-2">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn-brand" id="new-chat-create-btn"><i class="bi bi-plus-lg"></i> Start chat</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/modals.js"></script>
<script src="../assets/js/agent.js"></script>
</body>
</html>
