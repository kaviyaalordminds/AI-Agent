<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spreadsheet Generation · AI Agent Platform</title>
<script>
  (function () {
    var theme = localStorage.getItem("aiagent:theme") || "dark";
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/agent.css">
<link rel="stylesheet" href="../assets/css/documents.css">
<link rel="stylesheet" href="../assets/css/media-generation.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="app-sidebar"></aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="sidebar-collapse-btn d-md-none" id="mobile-sidebar-toggle"><i class="bi bi-list"></i></button>
        <h5 class="mb-0">Spreadsheet Generation</h5>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="theme-toggle" data-theme-toggle>
          <button type="button" data-theme-value="light" title="Light theme"><i class="bi bi-sun"></i></button>
          <button type="button" data-theme-value="dark" title="Dark theme"><i class="bi bi-moon-stars"></i></button>
        </div>
        <div class="user-menu-trigger" onclick="window.location.href='profile.html'">
          <div class="avatar-circle" id="topbar-user-avatar">--</div>
          <div class="d-none d-sm-block">
            <div style="font-size:0.85rem; font-weight:600;" id="topbar-user-name">Loading…</div>
            <div style="font-size:0.72rem; color:var(--text-muted);" id="topbar-user-email"></div>
          </div>
        </div>
        <button type="button" class="btn-ghost" id="topbar-logout-btn" title="Log out"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </header>

    <main class="app-content">
      <div class="gen-columns">
        <div>
          <div class="surface p-4 gen-form">
            <h6 class="mb-3">Workbook details</h6>
            <label class="field-label" for="excel-title">Title</label>
            <input type="text" class="form-control-premium" id="excel-title" placeholder="e.g. Sales Report FY26">
            <div class="field-error" data-error-for="title"></div>

            <div class="mb-1 mt-3">
              <label class="field-label" for="excel-project">Project <span style="font-weight:400; color:var(--text-muted);">(optional)</span></label>
              <select class="form-control-premium" id="excel-project">
                <option value="">No project</option>
              </select>
            </div>
          </div>

          <div class="surface p-4 mt-3">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <h6 class="mb-0">Sheets</h6>
              <span class="field-error" data-error-for="sheets" style="margin:0;"></span>
            </div>
            <div id="excel-sheets"></div>
            <div class="add-slide-bar">
              <button type="button" class="btn-ghost" id="excel-add-sheet"><i class="bi bi-plus-lg"></i> Add sheet</button>
            </div>
          </div>

          <button type="button" class="btn-brand mt-3" id="excel-generate-btn"><i class="bi bi-file-earmark-spreadsheet"></i> Generate spreadsheet</button>

          <div class="surface p-4 mt-4" id="excel-result-panel" style="display:none;">
            <div class="d-flex align-items-center justify-content-between mb-3">
              <h6 class="mb-0" id="excel-result-title">Spreadsheet</h6>
              <span id="excel-result-status"></span>
            </div>
            <div id="excel-result-body"></div>
          </div>
        </div>

        <div class="surface p-4">
          <h6 class="mb-3">Generated spreadsheets</h6>
          <div id="excel-list">
            <div class="skeleton mb-2" style="height:56px; border-radius:10px;"></div>
            <div class="skeleton" style="height:56px; border-radius:10px;"></div>
          </div>
          <div id="excel-list-empty" class="empty-state d-none" style="padding:1.5rem 0.5rem;">
            <div class="empty-icon"><i class="bi bi-file-earmark-spreadsheet"></i></div>
            <h6>No spreadsheets yet</h6>
            <p style="font-size:0.82rem;">Spreadsheets you generate will be listed here for download.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/modals.js"></script>
<script src="../assets/js/generation-common.js"></script>
<script src="../assets/js/excel-generation.js"></script>
</body>
</html>
