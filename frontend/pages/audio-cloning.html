<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audio Cloning · Shadow AI</title>
<script>
  (function () {
    var theme = localStorage.getItem("aiagent:theme") || "dark";
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/agent.css">
<link rel="stylesheet" href="../assets/css/documents.css">
<link rel="stylesheet" href="../assets/css/media-generation.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="app-sidebar"></aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="sidebar-collapse-btn d-md-none" id="mobile-sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar"><i class="bi bi-list"></i></button>
        <h5 class="mb-0">Audio Cloning</h5>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="theme-toggle" data-theme-toggle>
          <button type="button" data-theme-value="light" title="Light theme"><i class="bi bi-sun"></i></button>
          <button type="button" data-theme-value="dark" title="Dark theme"><i class="bi bi-moon-stars"></i></button>
        </div>
        <div class="user-menu-trigger" onclick="window.location.href='profile.html'">
          <div class="avatar-circle" id="topbar-user-avatar">--</div>
          <div class="d-none d-sm-block">
            <div style="font-size:0.85rem; font-weight:600;" id="topbar-user-name">Loading…</div>
            <div style="font-size:0.72rem; color:var(--text-muted);" id="topbar-user-email"></div>
          </div>
        </div>
        <button type="button" class="btn-ghost" id="topbar-logout-btn" title="Log out"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </header>

    <main class="app-content">
      <div id="capability-banner" class="capability-banner d-none">
        <i class="bi bi-exclamation-triangle-fill"></i><span></span>
      </div>

      <div class="gen-columns">
        <div>
          <div class="surface p-4 gen-form">
            <h6 class="mb-3">Clone a voice</h6>

            <label class="field-label" for="clone-name">Voice name</label>
            <input type="text" class="form-control-premium" id="clone-name" placeholder="e.g. My narration voice" maxlength="255">
            <div class="field-error" data-error-for="name"></div>

            <label class="field-label mt-3" for="clone-file">Voice sample <span style="font-weight:400; color:var(--text-muted);">(a clear recording of the voice, ~30s or more)</span></label>
            <input type="file" class="form-control-premium" id="clone-file" accept="audio/*">
            <div class="field-error" data-error-for="file"></div>
            <div id="clone-file-name" class="mt-2" style="font-size:0.82rem; color:var(--text-muted);"></div>

            <div class="form-check mt-3">
              <input class="form-check-input" type="checkbox" id="clone-consent">
              <label class="form-check-label" for="clone-consent" style="font-size:0.85rem;">
                I confirm I have the right and permission to clone this voice, and will not use it to impersonate or deceive anyone.
              </label>
            </div>
            <div class="field-error" data-error-for="consent"></div>

            <button type="button" class="btn-brand mt-3" id="clone-create-btn"><i class="bi bi-person-vcard"></i> Clone voice</button>
          </div>
        </div>

        <div class="surface p-4">
          <h6 class="mb-3">Your cloned voices</h6>
          <div id="voice-list">
            <div class="skeleton mb-2" style="height:56px; border-radius:10px;"></div>
            <div class="skeleton" style="height:56px; border-radius:10px;"></div>
          </div>
          <div id="voice-list-empty" class="empty-state d-none" style="padding:1.5rem 0.5rem;">
            <div class="empty-icon"><i class="bi bi-person-vcard"></i></div>
            <h6>No cloned voices yet</h6>
            <p style="font-size:0.82rem;">Voices you clone can be selected on the Audio Generation page.</p>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/modals.js"></script>
<script src="../assets/js/generation-common.js"></script>
<script src="../assets/js/audio-cloning.js"></script>
</body>
</html>
