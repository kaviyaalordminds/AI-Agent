<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password · Shadow AI</title>
<script>
  (function () {
    var theme = localStorage.getItem("aiagent:theme") || "dark";
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

<div class="auth-shell">
  <aside class="auth-brand-panel">
    <div class="brand-mark">
      <span class="glyph"><i class="bi bi-stars"></i></span>
      Shadow AI
    </div>
    <div>
      <h1>Choose a new password.</h1>
      <p class="lede">For your security, this will sign you out of every device.</p>
    </div>
    <div style="color:#74768e; font-size:0.8rem;">&copy; 2026 Shadow AI</div>
  </aside>

  <main class="auth-form-panel">
    <div class="auth-top-bar">
      <div class="theme-toggle" data-theme-toggle>
        <button type="button" data-theme-value="light" title="Light theme"><i class="bi bi-sun"></i></button>
        <button type="button" data-theme-value="dark" title="Dark theme"><i class="bi bi-moon-stars"></i></button>
      </div>
    </div>

    <div class="auth-form-card">
      <h2>Set a new password</h2>
      <p class="subtitle">Make it strong — at least 10 characters with a mix of cases, numbers and symbols.</p>

      <div id="reset-alert" class="alert-inline" role="alert"></div>

      <form id="reset-form" novalidate>
        <div class="mb-1">
          <label class="field-label" for="new_password">New password</label>
          <input class="form-control-premium" type="password" id="new_password" name="new_password" placeholder="Enter new password" required autocomplete="new-password" />
          <div id="password-strength-bars" class="password-strength">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
          </div>
          <div id="password-strength-label" class="password-strength-label"></div>
          <div class="field-error" data-error-for="new_password"></div>
        </div>
        <div class="mb-3 mt-2">
          <label class="field-label" for="confirm_password">Confirm new password</label>
          <input class="form-control-premium" type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required autocomplete="new-password" />
          <div class="field-error" data-error-for="confirm_password"></div>
        </div>

        <button type="submit" id="reset-submit" class="btn-brand w-100 mt-2">
          <i class="bi bi-key"></i> Reset password
        </button>
      </form>

      <p class="form-footer-link"><a href="login.html"><i class="bi bi-arrow-left"></i> Back to login</a></p>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/auth.js"></script>
<script>window.AuthPages.initResetPassword();</script>
</body>
</html>
