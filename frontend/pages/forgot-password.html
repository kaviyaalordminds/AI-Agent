<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forgot password · Shadow AI</title>
<script>
  (function () {
    var theme = localStorage.getItem("aiagent:theme") || "dark";
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>

<div class="auth-shell">
  <aside class="auth-brand-panel">
    <div class="brand-mark">
      <span class="glyph"><i class="bi bi-stars"></i></span>
      Shadow AI
    </div>
    <div>
      <h1>Forgot your password?</h1>
      <p class="lede">No problem. We'll email you a secure, one-time link to reset it.</p>
    </div>
    <div style="color:#74768e; font-size:0.8rem;">&copy; 2026 Shadow AI</div>
  </aside>

  <main class="auth-form-panel">
    <div class="auth-top-bar">
      <div class="theme-toggle" data-theme-toggle>
        <button type="button" data-theme-value="light" title="Light theme"><i class="bi bi-sun"></i></button>
        <button type="button" data-theme-value="dark" title="Dark theme"><i class="bi bi-moon-stars"></i></button>
      </div>
    </div>

    <div class="auth-form-card">
      <h2>Reset your password</h2>
      <p class="subtitle">Enter the email address associated with your account.</p>

      <div id="forgot-alert" class="alert-inline" role="alert"></div>

      <form id="forgot-form" novalidate>
        <div class="mb-3">
          <label class="field-label" for="email">Email address</label>
          <input class="form-control-premium" type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email" />
          <div class="field-error" data-error-for="email"></div>
        </div>

        <button type="submit" id="forgot-submit" class="btn-brand w-100 mt-2">
          <i class="bi bi-send"></i> Send reset link
        </button>
      </form>

      <p class="form-footer-link"><a href="login.html"><i class="bi bi-arrow-left"></i> Back to login</a></p>
    </div>
  </main>
</div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/auth.js"></script>
<script>window.AuthPages.initForgotPassword();</script>
</body>
</html>
