<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>System Status · Shadow AI</title>
<script>
  (function () {
    var theme = localStorage.getItem("aiagent:theme") || "dark";
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
<link rel="stylesheet" href="../assets/vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/system-status.css">
</head>
<body>

<div class="app-shell">
  <aside class="app-sidebar" id="app-sidebar"></aside>

  <div class="app-main">
    <header class="app-topbar">
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="sidebar-collapse-btn d-md-none" id="mobile-sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar"><i class="bi bi-list"></i></button>
        <h5 class="mb-0">System Status</h5>
      </div>
      <div class="d-flex align-items-center gap-3">
        <button type="button" class="btn-ghost" id="status-refresh-btn" style="font-size:0.8rem; padding:0.4rem 0.8rem;"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
        <div class="theme-toggle" data-theme-toggle>
          <button type="button" data-theme-value="light" title="Light theme"><i class="bi bi-sun"></i></button>
          <button type="button" data-theme-value="dark" title="Dark theme"><i class="bi bi-moon-stars"></i></button>
        </div>
        <div class="user-menu-trigger" onclick="window.location.href='profile.html'">
          <div class="avatar-circle" id="topbar-user-avatar">--</div>
          <div class="d-none d-sm-block">
            <div style="font-size:0.85rem; font-weight:600;" id="topbar-user-name">Loading…</div>
            <div style="font-size:0.72rem; color:var(--text-muted);" id="topbar-user-email"></div>
          </div>
        </div>
        <button type="button" class="btn-ghost" id="topbar-logout-btn" title="Log out"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </header>

    <main class="app-content">
      <div class="surface p-4 mb-4">
        <h6 class="mb-3">Capabilities</h6>
        <p style="font-size:0.8rem; color:var(--text-muted);" class="mb-3">
          Real, current status per capability — never a hard-coded "working" state. Local
          development runs without any cloud API key; unavailable capabilities show exactly
          why and how to enable them.
        </p>
        <div class="capability-grid" id="status-capability-grid">
          <div class="skeleton" style="height:120px; border-radius:14px;"></div>
          <div class="skeleton" style="height:120px; border-radius:14px;"></div>
          <div class="skeleton" style="height:120px; border-radius:14px;"></div>
        </div>
      </div>

      <div class="surface p-4">
        <h6 class="mb-3">Component Health</h6>
        <div id="status-health-list">
          <div class="skeleton mb-2" style="height:56px; border-radius:10px;"></div>
          <div class="skeleton" style="height:56px; border-radius:10px;"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/api.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/nav.js"></script>
<script src="../assets/js/system-status.js"></script>
<script>
  (async function () {
    const user = await window.AppShell.initAppShell("system-status");
    if (!user) return;
    document.getElementById("status-refresh-btn").addEventListener("click", () => {
      window.SystemStatus.loadSystemStatus("status-capability-grid", "status-health-list");
    });
    await window.SystemStatus.loadSystemStatus("status-capability-grid", "status-health-list");
  })();
</script>
</body>
</html>
