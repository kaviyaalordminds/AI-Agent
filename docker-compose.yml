services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_agent
      POSTGRES_PASSWORD: ai_agent
      POSTGRES_DB: ai_agent_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_agent -d ai_agent_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
